<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>HAUNTED MANSION — Halloween Hunt</title>
<style>
:root{--orange:#ffad4d;--purple:#a77aff;--ink:#100a1b}
*{box-sizing:border-box}
body{margin:0;background:#100a1b;color:#fff3e4;font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif}
.shell{width:min(1100px,100%);margin:0 auto;padding:12px}
header{text-align:center;padding:12px 8px 15px;background:radial-gradient(ellipse at 50% 0,#4b235f,#171025 72%);border:1px solid #69436f;border-radius:16px 16px 0 0}
.kicker{font-size:10px;letter-spacing:4px;color:#ffbc72;font-weight:800}
h1{margin:5px 0;color:#ffb45d;font-size:clamp(24px,5vw,40px);letter-spacing:1px;text-shadow:0 0 20px #f70}
.sub{font-size:12px;color:#d8c2e9}
.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:9px;background:#130d20;border-inline:1px solid #69436f}
.stat{text-align:center;padding:7px 3px;border:1px solid #573b68;background:#251833;border-radius:10px}
.stat span{display:block;color:#cdb5df;font-size:10px}.stat strong{display:block;color:var(--orange);font-size:clamp(19px,4vw,27px);font-variant-numeric:tabular-nums}
.arena{position:relative;width:100%;aspect-ratio:3/2;max-height:660px;min-height:310px;overflow:hidden;background:#171026;border:1px solid #69436f;touch-action:manipulation;user-select:none}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.vignette{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,#08051420,transparent 35%,#09051130);box-shadow:inset 0 0 65px #0905138c}
.web{position:absolute;z-index:2;width:10%;max-width:85px;opacity:.85;pointer-events:none;filter:drop-shadow(0 0 5px #b67cff)}
.web.tl{top:0;left:0}.web.tr{top:0;right:0;transform:scaleX(-1)}.web.bl{bottom:0;left:0;transform:scaleY(-1)}.web.br{bottom:0;right:0;transform:scale(-1)}
.objects{position:absolute;inset:0;z-index:3;overflow:hidden}
.target{position:absolute;display:flex;align-items:center;justify-content:center;padding:0;border:0;background:transparent;cursor:crosshair;touch-action:manipulation;transform:translate(-50%,-50%);animation:appear .18s ease-out;filter:drop-shadow(0 4px 6px #0008)}
.target img{width:100%;height:100%;object-fit:contain;pointer-events:none}
.target.ghost img{animation:float 1.1s ease-in-out infinite alternate}
.target.bat img{animation:flap .2s ease-in-out infinite alternate}
.target.ghost{filter:drop-shadow(0 0 12px #ffffff)}
.target.bat{filter:drop-shadow(0 0 12px #b693ed)}
.target.pumpkin{filter:drop-shadow(0 0 12px #ff8a25)}
.target:active{transform:translate(-50%,-50%) scale(.9)}
.aim-effect{position:absolute;z-index:7;left:0;top:0;width:clamp(72px,11vw,124px);height:clamp(72px,11vw,124px);pointer-events:none;transform:translate(-50%,-50%);opacity:1;transition:opacity .35s ease-out;filter:drop-shadow(0 0 10px #fff)}
.aim-marker{display:block;width:100%;height:100%;object-fit:contain;animation:aimLock .5s cubic-bezier(.15,.85,.25,1) both}
.aim-ring{position:absolute;inset:20%;border:3px solid #fff;border-radius:50%;box-shadow:0 0 12px #ffad4d,inset 0 0 8px #a77aff;animation:aimShock .55s ease-out both}
.aim-effect.fading{opacity:0}
@keyframes aimLock{0%{transform:scale(.25) rotate(-35deg);opacity:0}55%{transform:scale(1.18) rotate(8deg);opacity:1}75%{transform:scale(.94) rotate(-3deg)}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes aimShock{0%{transform:scale(.25);opacity:1}100%{transform:scale(2.8);opacity:0}}
.popup{position:absolute;z-index:8;pointer-events:none;font-size:clamp(16px,3vw,24px);font-weight:950;color:#ffe29b;text-shadow:0 2px 6px #000;animation:pop .65s forwards}
.toast{position:absolute;z-index:9;top:48%;left:50%;transform:translate(-50%,-50%);text-align:center;width:90%;font-size:clamp(17px,3.5vw,27px);font-weight:900;color:#ffe2a6;text-shadow:0 2px 9px #000;pointer-events:none}
.controls{display:flex;gap:8px;padding:10px;background:#171023;border-inline:1px solid #69436f}
button.ui{flex:1;padding:12px 8px;border:1px solid #82577d;border-radius:10px;background:#32203e;color:#fff1e3;font-weight:850;font-size:13px;cursor:pointer}
button.ui.primary{background:var(--orange);color:#29152d;border-color:#ffcb80}
button.ui:disabled{opacity:.5;cursor:default}
.legend{padding:12px;background:#100b19;border:1px solid #69436f;border-radius:0 0 16px 16px}
.legend h2{margin:0 0 9px;color:#ffb66b;font-size:11px;letter-spacing:2px}
.items{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.item{display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid #3d294b;background:#21162c;border-radius:9px;padding:8px 3px}
.item img{width:38px;height:38px;object-fit:contain}.item b{display:block;font-size:11px}.item small{color:var(--orange);font-weight:850}
.help{text-align:center;color:#c4afcf;font-size:11px;line-height:1.8;margin-top:10px}
@keyframes float{from{transform:translateY(-5px) rotate(-3deg)}to{transform:translateY(7px) rotate(3deg)}}
@keyframes flap{from{transform:rotate(-8deg) scale(.94)}to{transform:rotate(8deg) scale(1.04)}}
@keyframes appear{from{opacity:0;scale:.6}to{opacity:1;scale:1}}
@keyframes shrinkAway{from{opacity:1;scale:1}to{opacity:0;scale:.02}}
.target.shrinking{animation:shrinkAway .18s ease-in forwards;pointer-events:none;transform-origin:center}
.arena:fullscreen{width:100vw;height:100vh;max-height:none;min-height:0;aspect-ratio:auto;border:0;background:#100a1b}
.arena:fullscreen .bg{object-fit:contain;background:#100a1b}
.arena:fullscreen .target{width:clamp(52px,8vw,105px)!important;height:clamp(52px,8vw,105px)!important}
.arena:fullscreen .toast{font-size:clamp(24px,4vw,44px)}
@keyframes pop{to{opacity:0;translate:0 -35px;scale:1.15}}
@media(max-width:520px){.shell{padding:5px}.arena{min-height:300px;aspect-ratio:4/5}.bg{object-fit:cover}.items{gap:4px}.item{flex-direction:column;gap:2px}.item img{width:34px;height:34px}.controls{gap:5px;padding:7px}.ui{font-size:11px!important;padding:11px 4px!important}}
</style>
</head>
<body>
<div class="shell">
<header><div class="kicker">✦ HALLOWEEN SPECIAL ✦</div><h1>🏚️ HAUNTED MANSION</h1><div class="sub">呪われた洋館で、モンスターをハントしよう！</div></header>
<div class="hud">
<div class="stat"><span>🎃 SCORE</span><strong id="score">0</strong></div>
<div class="stat"><span>⏳ TIME</span><strong id="time">60</strong></div>
<div class="stat"><span>👻 HUNT</span><strong id="hits">0</strong></div>
</div>
<div class="arena" id="arena" aria-label="ゲーム画面">
<img class="bg" src="assets/mansion.png" alt="月明かりのハロウィン屋敷">
<div class="vignette"></div>
<div class="objects" id="objects"></div>
<div class="toast" id="toast">👻 ゲームスタートでハント開始！</div>
</div>
<div class="controls">
<button class="ui primary" id="start">▶ ゲームスタート</button>
<button class="ui" id="pause" disabled>Ⅱ 一時停止</button>
<button class="ui" id="fullscreen">⛶ 全画面</button>
<button class="ui" id="reset">↻ リセット</button>
</div>
<div class="legend">
<h2>✦ MONSTER HUNT GUIDE ✦</h2>
<div class="items">
<div class="item"><img src="assets/ghost.png" alt=""><div><b>おばけ</b><small>+10点</small></div></div>
<div class="item"><img src="assets/pumpkin.png" alt=""><div><b>かぼちゃ</b><small>+5点</small></div></div>
<div class="item"><img src="assets/bat.png" alt=""><div><b>コウモリ</b><small>+15点・高速！</small></div></div>
</div>
<div class="help">👻 おばけは空中をふわふわ移動。コウモリは素早く飛び回る！<br>🎃 かぼちゃは床や机の上に出現。屋敷に現れるターゲットを狙おう！<br>60秒以内にターゲットをタップして、ハイスコアを目指そう！</div>
</div>
</div>
<script>
(()=>{
const $=id=>document.getElementById(id),arena=$('arena'),layer=$('objects'),toast=$('toast');
const imgs={ghost:'assets/ghost.png',bat:'assets/bat.png',batDown:'assets/bat_down.png',pumpkin:'assets/pumpkin.png'};
let score=0,hits=0,time=60,running=false,paused=false,clock=null,raf=null,last=0,spawnElapsed=0,targets=[],seq=0,best=0;
const rnd=(a,b)=>a+Math.random()*(b-a);
function hud(){$('score').textContent=score;$('hits').textContent=hits;$('time').textContent=time}
function clear(){targets.forEach(t=>{if(t.el.dataset.flapTimer)clearInterval(Number(t.el.dataset.flapTimer));t.el.remove()});targets=[];layer.innerHTML=''}
function makeTarget(){
if(!running||paused||targets.length>=7)return;
const roll=Math.random(),kind=roll<.44?'ghost':roll<.75?'bat':'pumpkin';
const el=document.createElement('button');el.className='target '+kind;el.setAttribute('aria-label',kind==='ghost'?'おばけをタップ':kind==='bat'?'コウモリをタップ':'かぼちゃをタップ');el.type='button';
const img=document.createElement('img');img.src=imgs[kind];img.alt='';el.appendChild(img);layer.appendChild(el);
if(kind==='bat'){
  img.dataset.wingsUp=imgs.bat;
  img.dataset.wingsDown=imgs.batDown;
  img.src=img.dataset.wingsUp;
  let wingUp=true;
  const flapTimer=setInterval(()=>{
    if(!el.isConnected){clearInterval(flapTimer);return;}
    img.src=wingUp?img.dataset.wingsDown:img.dataset.wingsUp;
    wingUp=!wingUp;
  },150);
  el.dataset.flapTimer=String(flapTimer);
}
const w=arena.clientWidth,h=arena.clientHeight;
let x,y;
if(kind==='pumpkin'){x=rnd(w*.12,w*.88);y=rnd(h*.70,h*.87)}
else{x=rnd(w*.10,w*.90);y=rnd(h*.16,h*.62)}
const t={id:++seq,kind,el,x,y,vx:rnd(-1,1)*(kind==='bat'?2.3:.75),vy:rnd(-1,1)*(kind==='bat'?1.9:.55),age:0,life:kind==='bat'?rnd(1250,2200):kind==='ghost'?rnd(2300,3600):rnd(3200,4700),phase:rnd(0,6.28),dead:false};
const size=kind==='ghost'?Math.min(82,w*.14):kind==='bat'?Math.min(84,w*.15):Math.min(150,w*.26);
el.style.width=size+'px';el.style.height=size+'px';el.style.left=x+'px';el.style.top=y+'px';

el.addEventListener('pointerdown',e=>{e.preventDefault();if(!running||paused||t.dead)return;t.dead=true;const points={ghost:10,bat:15,pumpkin:5}[kind];score+=points;hits++;hud();toast.textContent=kind==='ghost'?'👻 おばけをキャッチ！ +10点':kind==='bat'?'🦇 コウモリをキャッチ！ +15点':'🎃 かぼちゃをゲット！ +5点';const aim=document.createElement('div');aim.className='aim-effect';aim.setAttribute('aria-hidden','true');aim.style.left=t.x+'px';aim.style.top=t.y+'px';const ring=document.createElement('span');ring.className='aim-ring';const aimImg=document.createElement('img');aimImg.className='aim-marker';aimImg.src='assets/aim.png';aimImg.alt='';aim.append(ring,aimImg);layer.appendChild(aim);setTimeout(()=>{aim.classList.add('fading');setTimeout(()=>aim.remove(),360)},500);const p=document.createElement('div');p.className='popup';p.textContent='+'+points;p.style.left=t.x+'px';p.style.top=t.y+'px';p.style.transform='translate(-50%,-50%)';layer.appendChild(p);setTimeout(()=>p.remove(),700);if(el.dataset.flapTimer)clearInterval(Number(el.dataset.flapTimer));el.remove();targets=targets.filter(a=>a!==t);while(running&&!paused&&targets.length<2)makeTarget()});
targets.push(t)
}
function tick(ts){
if(!running||paused)return;if(!last)last=ts;const dt=Math.min(40,ts-last);last=ts;const w=arena.clientWidth,h=arena.clientHeight;
for(const t of [...targets]){
t.age+=dt;if(t.age>t.life){if(!t.shrinking){t.shrinking=true;if(t.el.dataset.flapTimer)clearInterval(Number(t.el.dataset.flapTimer));t.el.classList.add('shrinking');setTimeout(()=>{t.el.remove();targets=targets.filter(a=>a!==t)},190)}continue}
if(t.kind!=='pumpkin'){
const speed=t.kind==='bat'?2.4:1;
t.x+=t.vx*dt*.045*speed+Math.sin(t.age*.003+t.phase)*dt*.016*speed;
t.y+=t.vy*dt*.045*speed+Math.cos(t.age*.004+t.phase)*dt*.012*speed;
if(t.x<35||t.x>w-35)t.vx*=-1;if(t.y<h*.1||t.y>h*.65)t.vy*=-1;
t.x=Math.max(35,Math.min(w-35,t.x));t.y=Math.max(h*.1,Math.min(h*.65,t.y));
t.el.style.left=t.x+'px';t.el.style.top=t.y+'px';
/* Ghosts and bats keep the z-index assigned when they spawned. */
}
}
/* Keep at least two active targets on screen, even after targets expire. */
while(targets.length<2)makeTarget();
spawnElapsed+=dt;if(spawnElapsed>Math.max(420,1050-time*7)){spawnElapsed=0;makeTarget()}
raf=requestAnimationFrame(tick)
}
function finish(){running=false;paused=false;clearInterval(clock);cancelAnimationFrame(raf);$('pause').disabled=true;$('pause').textContent='Ⅱ 一時停止';best=Math.max(best,score);toast.textContent='🎉 タイムアップ！ '+score+'点！';$('start').textContent='▶ もう一度プレイ'}
function start(){clearInterval(clock);cancelAnimationFrame(raf);clear();score=0;hits=0;time=60;running=true;paused=false;last=0;spawnElapsed=0;hud();toast.textContent='👻 ターゲットをタップ！';$('start').textContent='↻ 最初から';$('pause').disabled=false;$('pause').textContent='Ⅱ 一時停止';makeTarget();makeTarget();makeTarget();raf=requestAnimationFrame(tick);clock=setInterval(()=>{if(!running||paused)return;time--;hud();if(time<=0)finish()},1000)}
$('start').addEventListener('click',start);
$('pause').addEventListener('click',()=>{if(!running)return;paused=!paused;$('pause').textContent=paused?'▶ 再開':'Ⅱ 一時停止';if(paused){cancelAnimationFrame(raf);toast.textContent='⏸️ 一時停止中'}else{last=0;toast.textContent='👻 ハント再開！';raf=requestAnimationFrame(tick)}});
$('reset').addEventListener('click',()=>{running=false;paused=false;clearInterval(clock);cancelAnimationFrame(raf);clear();score=0;hits=0;time=60;last=0;spawnElapsed=0;hud();toast.textContent='👻 ゲームスタートでハント開始！';$('start').textContent='▶ ゲームスタート';$('pause').disabled=true;$('pause').textContent='Ⅱ 一時停止'});
$('fullscreen').addEventListener('click',async()=>{
 try{
   if(!document.fullscreenElement){await arena.requestFullscreen();$('fullscreen').textContent='⛶ 全画面終了';}
   else{await document.exitFullscreen();$('fullscreen').textContent='⛶ 全画面';}
 }catch(e){toast.textContent='この環境では全画面表示を利用できません。';}
});
document.addEventListener('fullscreenchange',()=>{$('fullscreen').textContent=document.fullscreenElement?'⛶ 全画面終了':'⛶ 全画面';});
hud();
})();
</script>
</body></html>
